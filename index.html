<!DOCTYPE html>
<html>
<head>
    <title>Live Network Traffic</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #00ff00; padding: 20px; }
        table { width: 100%; text-align: left; border-collapse: collapse; }
        th { border-bottom: 2px solid #00ff00; padding-bottom: 5px; }
        td { border-bottom: 1px solid #333; padding: 5px 0; }
    </style>
</head>
<body>
    <h2>Live Network Traffic</h2>
    <table>
        <thead>
            <tr>
                <th>EtherType</th>
                <th>Protocol</th>
                <th>Source</th>
                <th>Destination</th>
                <th>MAC Source</th>
            </tr>
        </thead>
        <tbody id="packetTable">
            <!-- Packets will appear here -->
        </tbody>
    </table>

    <script>
        const tableBody = document.getElementById('packetTable');

        // Helpers
        const intToIp = (int) => int ? `${(int >>> 24) & 255}.${(int >>> 16) & 255}.${(int >>> 8) & 255}.${int & 255}` : 'N/A';
        const getProtocol = (num) => num === 6 ? 'TCP' : num === 17 ? 'UDP' : num ? `Other (${num})` : 'N/A';
        const hex = (num) => num ? `0x${num.toString(16).toUpperCase()}` : 'N/A';

        // WebSocket Connection
        const ws = new WebSocket('ws://localhost:8000/packets');

        ws.onmessage = (event) => {
            const p = JSON.parse(event.data);
            
            // 1. Create a new row
            const row = tableBody.insertRow(0); // Insert at the very top
            
            // 2. Populate the cells
            row.insertCell(0).innerText = hex(p.etherType);
            row.insertCell(1).innerText = getProtocol(p.networkProtocol);
            row.insertCell(2).innerText = `${intToIp(p.sourceIp)}:${p.sourcePort || 'N/A'}`;
            row.insertCell(3).innerText = `${intToIp(p.destIp)}:${p.destPort || 'N/A'}`;
            row.insertCell(4).innerText = p.sourceMac.toString(16).toUpperCase();

            // 3. Keep only the latest 50 rows to prevent memory leaks
            if (tableBody.rows.length > 50) {
                tableBody.deleteRow(50);
            }
        };
    </script>
</body>
</html>
