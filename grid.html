<!DOCTYPE html>
<html>
<head>
    <title>Packet Matrix</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* The Legend */
        #legend {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            font-size: 14px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .box { width: 14px; height: 14px; border-radius: 2px; }

        /* The Grid */
        #grid {
            display: grid;
            /* 60 columns wide */
            grid-template-columns: repeat(60, 1fr);
            gap: 2px;
            width: 95vw;
            max-width: 1200px;
        }
        .square {
            aspect-ratio: 1; /* Keeps them perfectly square */
            background-color: #1f2428; /* Empty state */
            border-radius: 1px;
        }
    </style>
</head>
<body>
    <div id="legend">
        <div class="legend-item"><div class="box" style="background: #58a6ff;"></div> TCP</div>
        <div class="legend-item"><div class="box" style="background: #3fb950;"></div> UDP</div>
        <div class="legend-item"><div class="box" style="background: #e3b341;"></div> ICMP</div>
        <div class="legend-item"><div class="box" style="background: #bc8cff;"></div> Other IP</div>
        <div class="legend-item"><div class="box" style="background: #ff7b72;"></div> Non-IP (ARP, etc)</div>
    </div>

    <div id="grid"></div>

    <script>
        // Total squares in the grid (60 cols * 40 rows = 2400 packets)
        const TOTAL_SQUARES = 2400; 
        const grid = document.getElementById('grid');
        const squares = [];

        // 1. Generate the grid DOM elements once
        for (let i = 0; i < TOTAL_SQUARES; i++) {
            const sq = document.createElement('div');
            sq.className = 'square';
            grid.appendChild(sq);
            squares.push(sq); // Store reference for extremely fast O(1) lookups
        }

        let currentIndex = 0;

        // 2. Color mapping logic based on your C# struct
        function getPacketColor(p) {
            // If EtherType is not 0x0800 (IPv4), it's likely ARP or IPv6
            if (p.etherType !== 2048) return '#ff7b72'; // Red
            
            switch (p.networkProtocol) {
                case 6: return '#58a6ff';  // TCP = Blue
                case 17: return '#3fb950'; // UDP = Green
                case 1: return '#e3b341';  // ICMP = Yellow
                default: return '#bc8cff'; // Other IPv4 = Purple
            }
        }

        // 3. Connect to your C# server
        const ws = new WebSocket('ws://localhost:8000/packets/');

        ws.onmessage = (event) => {
            const packet = JSON.parse(event.data);
            
            // Instantly change the background color of the current square
            squares[currentIndex].style.backgroundColor = getPacketColor(packet);

            currentIndex++;

            // If we reach the end of the grid, wipe it clean and wrap around
            if (currentIndex >= TOTAL_SQUARES) {
                for (let i = 0; i < TOTAL_SQUARES; i++) {
                    squares[i].style.backgroundColor = '#1f2428';
                }
                currentIndex = 0;
            }
        };

        ws.onclose = () => console.log("Connection lost. Refresh the page to reconnect.");
    </script>
</body>
</html>
